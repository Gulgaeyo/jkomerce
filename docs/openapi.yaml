openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: |
    삼품, 주문, 결제, 장바구니 API 명세서입니다.
servers:
  - url: /api

tags:
  - name: Items
  - name: Orders
  - name: Payments
  - name: Cart

components:
  securitySchemes:
    cookie: apiKey
    in: cookie
    name: JSESSIONID

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request.
        details:
          type: array
          items:
            type: string
      required: [code, message]

    # --------- Items -----------
    ItemSummary:
      type: object
      properties:
        itemId: { type: integer, format: int64, example: 1 }
        itemName: { type: string, example: "Keyboard" }
        price: { type: integer, format: int64, example: 35000 }
        stock: { type: intefer, example: 12 }
      required: [itemId, itemName, price, stock]

    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/ItemSummary'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            deletedAt: { type: string, format: date-time }

    ItemImage:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        itemId: { type: integer, format: int64, example: 1 }
        image: { type: string, example: "/images/items/1/detail-1.jpg" }
        type:
          type: integer
          description: "0=PROFILE, 1=DETAIL, 2=GALLERY"
          example: 1
        sortOrder: {type: integer, example: 0 }
      required: [id, itemId, image, type, sortOrder]

      #--------- Orders --------------------
      OrderStatus:
        type: string
        description: "Order Status"
        enum: [PENDING, PAID, CANCELED, EXPIRED]

      OrderType:
        type: string
        enum: [DIRECT, CART]

      OrderItemLine:
        type: object
        properties:
          itemId: { type: integer, foramt: int64, example: 1 }
          quantity: { type: integer, example: 2, minimum: 1 }
          unitPrice: { type: integer, format: int64, example: 35000 }
          lineAmount: { type: integer, format: int64, example: 70000 }
        required: [itemId, quantity, unitPrice, lineAmount]

      OrderCreateItemRequest:
        type: object
        properties:
          itemId: { type: integer, format: int64, example: 1 }
          quantity: { type: integer, example: 2, minimum: 1 }
        required: [itemId, quantity]

      OrderCreateRequest:
        type: object
        properties:
          orederType:
            $ref: '#/components/schemas/OrderType'
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/OrderCreateItemRequest'
          required: [orderType, items]

      OrderCreateFromCartReauest:
        type: object
        description: "cartId를 생략하면 현재 장바구니의 전체 항복을 대상으로 주문을 생성합니다."
        properties:
          cartIds:
            type: array
            description: "주문에 포함할 장바구니 항목 ID 목록(선택)"
            items:
              type: integer
              format: int64
        additionalProperties: false

      OrderSummary:
        type: object
        properties:
          orderId: { type: integer, format: int64, example: 101 }
          userId: { type: integer, format: int64, example: 7}
          orderType:
            $ref: '#/components/schemas/OrderType'
          status:
            $reg: '#/components/schemas/OrderStatus'
          totalAmount: { type: integer, format: int64, example: 70000 }
          createdAt: { type: string, format: date-time}
      required: [orderId, userId, orderType, status, totalAmount, createdAt]

      OrderDetail:
        allOf:
          - $ref: '#/components/schemas/OrderSummary'
          - type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#components/schemas/OrderItemLine'
                updatedAt: { type: string, format: date-time }
                deletedAt: { type: string, format: date-time }
            required: [items]

      #--------Payments------------
      PaymentStatus:
        type: string
        enum: [REQUIRED, PAID, FAILED, CANCELED, EXPIRED]

      PaymentMethod:
        type: string
        example: CARD

      PaymentProvider:
        type: string
        example: MOCK

      PaymentCreateRequest:
        type: object
        properties:
          orderId: { type: integer, format: int64, example: 101 }
          method:
            $ref: '#/components/schemas/PaymentMethod'
          provider:
            $ref: '#/components/schemas/PaymentProviders'
          IdempotencyKey: {type: string, example: 4a1b7c8c-7a07-4a5b-9b3b-9f3f9d1c2b3a}
      required: [orderId, method, provider, idempotencyKey]

      PaymentResponse:
        type: object
        properties:
          paymentId: { type: integer, format: int64, example: 501 }
          orderId:
            type: integer
            format: int64
            example: 101
          amount:
            type: integer
            format: int64
            example: 70000
          status:
            $ref: '#/components/schemas/PaymentStatus'
          method:
            $ref: '#/components/schemas/PaymentMethod'
          provider:
            $ref: '#/components/schemas/PaymentProvider'
          expiresAt:
            type: string
            format: date-time
          approvedAt:
            type: string
            format: date-time
            nullable: true
          failReason:
            type: string
            nullable: true
          pgTid:
            type: string
            nullable: true
          createdAt:
            type: string
            format: date-time
        required: [ paymentId, orderId, amount, status, method, provider, expiresAt, createdAt ]

        PaymentApproveRequest:
          type: object
          description: 결제 승인 요청(Mock 또는 PG 콜백용)
          properties:
            pgTid:
              type: string
              example: PG-20260112-ABC123
          additionalProperties: false

        PaymentFailRequest:
          type: object
          description: 결제 실패 처리 요청(Mock)
          properties:
            failReason:
              type: string
              example: USER_CANCEL
          required: [ failReason ]

        # ---------------- Cart ----------------
        CartItem:
          type: object
          properties:
            cartId:
              type: integer
              format: int64
              example: 10
            itemId:
              type: integer
              format: int64
              example: 1
            quantity:
              type: integer
              example: 2
              minimum: 1
            createdAt:
              type: string
              format: date-time
          required: [ cartId, itemId, quantity, createdAt ]

        CartAddRequest:
          type: object
          properties:
            itemId:
              type: integer
              format: int64
              example: 1
            quantity:
              type: integer
              example: 2
              minimum: 1
          required: [ itemId, quantity ]

        CartUpdateRequest:
          type: object
          properties:
            quantity:
              type: integer
              example: 3
              minimum: 1
          required: [ quantity ]

      paths:
        # ---------------- Items ----------------
        /items:
          get:
            tags: [ Items ]
            summary: 상품 목록 조회
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/ItemSummary'

        /items/{itemId}:
          get:
            tags: [ Items ]
            summary: 상품 상세 조회
            parameters:
              - in: path
                name: itemId
                required: true
                schema:
                  type: integer
                  format: int64
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ItemDetail'
              '404':
                description: 상품을 찾을 수 없음
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /items/{itemId}/images:
          get:
            tags: [ Items ]
            summary: 상품 이미지 목록 조회
            parameters:
              - in: path
                name: itemId
                required: true
                schema:
                  type: integer
                  format: int64
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/ItemImage'

        # ---------------- Orders ----------------
        /orders:
          post:
            tags: [ Orders ]
            summary: 주문 생성
            description: |
              주문(orders)과 주문 상품(order_items)을 생성합니다.
              - orderId는 서버(DB)에서 생성됩니다.
              - 결제는 별도 Payments API로 진행합니다.
            security:
              - cookieAuth: [ ]
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/OrderCreateRequest'
            responses:
              '201':
                description: 생성 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderSummary'
              '422':
                description:
                  처리 불가(예: 재고 부족, 수량 오류)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /orders/from-cart:
          post:
            tags: [ Orders ]
            summary: 장바구니 기반 주문 생성
            description: |
              현재 사용자(로그인) 또는 세션(비회원)의 장바구니 항목을 기반으로 주문을 생성합니다.
              - cartIds를 전달하면 해당 항목만 주문에 포함합니다.
              - cartIds를 생략하면 장바구니 전체를 주문에 포함합니다.
            requestBody:
              required: false
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/OrderCreateFromCartRequest'
            responses:
              '201':
                description: 생성 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderSummary'
              '422':
                description:
                  처리 불가(예: 장바구니 비어있음, 재고 부족)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /orders/{orderId}:
          get:
            tags: [ Orders ]
            summary: 주문 상세 조회
            parameters:
              - in: path
                name: orderId
                required: true
                schema:
                  type: integer
                  format: int64
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderDetail'
              '404':
                description: 주문을 찾을 수 없음
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        # ---------------- Payments ----------------
        /payments:
          post:
            tags: [ Payments ]
            summary: 결제 요청 생성
            description: |
              주문(orderId)에 대한 결제 요청 레코드를 생성합니다.
              - idempotencyKey로 중복 요청을 방지합니다.
              - expiresAt(만료 일시)을 포함합니다.
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaymentCreateRequest'
            responses:
              '201':
                description: 생성 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PaymentResponse'
              '409':
                description:
                  충돌(예: idempotencyKey 중복)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'
              '422':
                description:
                  처리 불가(예: 주문 상태가 결제 불가)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /payments/{paymentId}:
          get:
            tags: [ Payments ]
            summary: 결제 상세 조회
            parameters:
              - in: path
                name: paymentId
                required: true
                description: 결제 ID
                schema:
                  type: integer
                  format: int64
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PaymentResponse'
              '404':
                description: 결제를 찾을 수 없음
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /payments/{paymentId}/approve:
          post:
            tags: [ Payments ]
            summary: 결제 승인 처리
            description: |
              결제 성공 처리 API(Mock 또는 PG 콜백 처리용).
              - 결제 상태를 PAID로 변경하고 approvedAt을 기록합니다.
              - 주문 상태도 PAID로 변경하는 것이 일반적입니다(구현 정책).
            parameters:
              - in: path
                name: paymentId
                required: true
                description: 결제 ID
                schema:
                  type: integer
                  format: int64
            requestBody:
              required: false
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaymentApproveRequest'
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PaymentResponse'
              '422':
                description:
                  처리 불가(예: 이미 종료된 결제, 만료됨)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /payments/{paymentId}/fail:
          post:
            tags: [ Payments ]
            summary: 결제 실패 처리
            description: |
              결제 실패 처리 API(Mock).
              - 결제 상태를 FAILED로 변경하고 failReason을 기록합니다.
              - 주문 상태를 CANCELED/EXPIRED 등으로 변경하는 정책을 적용할 수 있습니다.
            parameters:
              - in: path
                name: paymentId
                required: true
                description: 결제 ID
                schema:
                  type: integer
                  format: int64
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/PaymentFailRequest'
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/PaymentResponse'
              '422':
                description:
                  처리 불가(예: 이미 종료된 결제)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        # ---------------- Cart ----------------
        /cart:
          get:
            tags: [ Cart ]
            summary: 장바구니 조회
            description: |
              현재 장바구니 항목 목록을 조회합니다.
              - 로그인 상태면 user 기준, 비회원이면 session 기준으로 조회됩니다.
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        $ref: '#/components/schemas/CartItem'

          post:
            tags: [ Cart ]
            summary: 장바구니 담기
            description: 장바구니에 상품을 담습니다(동일 상품이 있으면 수량 합산 정책 가능).
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CartAddRequest'
            responses:
              '201':
                description: 생성 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CartItem'
              '422':
                description:
                  처리 불가(예: 수량 오류)
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

        /cart/{cartId}:
          patch:
            tags: [ Cart ]
            summary: 장바구니 수량 변경
            description: 장바구니 항목의 수량을 변경합니다.
            parameters:
              - in: path
                name: cartId
                required: true
                description: 장바구니 항목 ID
                schema:
                  type: integer
                  format: int64
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/CartUpdateRequest'
            responses:
              '200':
                description: 성공
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CartItem'
              '404':
                description: 장바구니 항목을 찾을 수 없음
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ErrorResponse'

          delete:
            tags: [ Cart ]
            summary: 장바구니 항목 삭제
            description: 장바구니 항목을 삭제합니다.
            parameters:
              - in: path
                name: cartId
                required: true
                description: 장바구니 항목 ID
                schema:
                  type: integer
                  format: int64
            responses:
              '204':
                description: 삭제 성공(응답 본문 없음)